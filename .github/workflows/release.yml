name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 180

    env:
      DEVELOPMENT_TEAM: 2U27S7L7CX

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Configure build paths
        run: |
          set -euo pipefail
          {
            echo "ARCHIVE_PATH=$RUNNER_TEMP/AttentionSeaker.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/export"
            echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData"
            echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/ExportOptions.plist"
            echo "NOTARIZATION_ZIP=$RUNNER_TEMP/AttentionSeaker-notarization.zip"
            echo "RELEASE_DIRECTORY=$RUNNER_TEMP/release"
          } >> "$GITHUB_ENV"

      - name: Read and validate the version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the form v1.2.3; received $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project AttentionSeaker.xcodeproj \
            -scheme AttentionSeaker \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing DEVELOPER_ID_CERTIFICATE_BASE64 secret}"
          : "${CERTIFICATE_PASSWORD:?Missing DEVELOPER_ID_CERTIFICATE_PASSWORD secret}"
          : "${KEYCHAIN_PASSWORD:?Missing KEYCHAIN_PASSWORD secret}"

          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperID.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -q "Developer ID Application"; then
            echo "The certificate secret does not contain a Developer ID Application identity." >&2
            exit 1
          fi

      - name: Archive the release app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project AttentionSeaker.xcodeproj \
            -scheme AttentionSeaker \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export the Developer ID app
        run: |
          set -euo pipefail
          plutil -create xml1 "$EXPORT_OPTIONS_PATH"
          plutil -insert method -string developer-id "$EXPORT_OPTIONS_PATH"
          plutil -insert destination -string export "$EXPORT_OPTIONS_PATH"
          plutil -insert signingStyle -string manual "$EXPORT_OPTIONS_PATH"
          plutil -insert signingCertificate -string "Developer ID Application" "$EXPORT_OPTIONS_PATH"
          plutil -insert teamID -string "$DEVELOPMENT_TEAM" "$EXPORT_OPTIONS_PATH"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"

          codesign --verify --deep --strict --verbose=2 \
            "$EXPORT_PATH/AttentionSeaker.app"

      - name: Notarize and staple
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${ASC_API_KEY_BASE64:?Missing ASC_API_KEY_BASE64 secret}"
          : "${ASC_API_KEY_ID:?Missing ASC_API_KEY_ID secret}"
          : "${ASC_API_ISSUER_ID:?Missing ASC_API_ISSUER_ID secret}"

          APP_PATH="$EXPORT_PATH/AttentionSeaker.app"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$NOTARIZATION_ZIP"

          xcrun notarytool submit "$NOTARIZATION_ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait \
            --timeout 2h

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package the release
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIRECTORY"
          RELEASE_ZIP="$RELEASE_DIRECTORY/AttentionSeaker-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$EXPORT_PATH/AttentionSeaker.app" \
            "$RELEASE_ZIP"

          cd "$RELEASE_DIRECTORY"
          shasum -a 256 "AttentionSeaker-$VERSION.zip" \
            > "AttentionSeaker-$VERSION.zip.sha256"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ASSETS=(
            "$RELEASE_DIRECTORY/AttentionSeaker-$VERSION.zip"
            "$RELEASE_DIRECTORY/AttentionSeaker-$VERSION.zip.sha256"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${RELEASE_ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${RELEASE_ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "AttentionSeaker $VERSION"
          fi

      - name: Delete temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
